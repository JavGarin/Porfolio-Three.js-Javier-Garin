<body
    x-data="{
        activeLink: null,
        showPanel: false,
        panelContent: '',
        currentLang: 'es',
        isLoading: true,
        countdown: 3,

        initLoader() {
            // Animación de partículas
            this.animateParticles();

            // Contador regresivo
            const interval = setInterval(() => {
                this.countdown--;

                if(this.countdown <= 0) {
                    clearInterval(interval);
                    setTimeout(() => {
                        this.isLoading = false;
                    }, 1500); // 1.5s adicionales para ver el mensaje final
                }
            }, 1000); // Cada número dura 1 segundo
        },

        animateParticles() {
            // Esta animación se manejará con CSS
        },

        openPanel(templateId, linkName) {
            const template = document.getElementById(templateId);
            if (template) {
                const contentClone = template.content.cloneNode(true);
                this.panelContent = '';
                const tempDiv = document.createElement('div');
                tempDiv.appendChild(contentClone);
                this.panelContent = tempDiv.innerHTML;
                this.activeLink = linkName;
                this.showPanel = true;
            } else {
                console.error('Template no encontrado:', templateId);
                this.panelContent = '<p>Error: Contenido no encontrado.</p>';
                this.activeLink = linkName;
                this.showPanel = true;
            }
        },

        closePanel() {
            this.showPanel = false;
        },

        setLang(lang) {
            this.currentLang = lang;
            if (this.showPanel && this.activeLink) {
                const activeTemplateId = `template-${this.activeLink}`;
                this.openPanel(activeTemplateId, this.activeLink);
            }
        }
    }"
    x-init="initLoader()"
    :class="{ 'panel-open': showPanel, 'loading': isLoading }"
    oncontextmenu="return false"
    onselectstart="return false"
    ondragstart="return false">

    <!-- Fondo negro estático -->
    <div class="background"></div>

    <!-- Contenedor principal con margen -->
    <div class="main-container">
        <!-- Contenedor para efectos dinámicos -->
        <div class="dynamic-background" id="threejs-container"></div>

        <!-- Contenido principal -->
        <div class="content">
            <div class="header">
                <div class="nombre-container">
                    <h1>Javier Garín</h1>
                    <h2>Developer & Designer</h2>
                </div>

                <div class="lang-switcher">
                    <button @click="setLang('es')" :class="{ 'active-lang': currentLang === 'es' }">es</button>
                    <span>|</span>
                    <button @click="setLang('en')" :class="{ 'active-lang': currentLang === 'en' }">en</button>
                </div>
            </div>

            <aside class="info-panel"

                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="translate-x-full opacity-0"
                x-transition:enter-end="translate-x-0 opacity-100"
                @click.outside="closePanel()"

                role="dialog"
                aria-modal="true">
                <button @click="closePanel()" class="close-button" aria-label="Cerrar panel">&times;</button>
                <div class="info-content" x-html="panelContent"></div>
            </aside>

            <div class="watermark">Javier Garín®</div>

            <nav class="menu-container">
                <a href="#contact"
                    @click.prevent="openPanel('template-contact', 'contact')"
                    :class="{ 'active-menu-item': activeLink === 'contact' }">
                    <span x-show="currentLang === 'es'">Contacto</span>
                    <span x-show="currentLang === 'en'">Contact</span>
                </a>
                <a href="#info"
                    @click.prevent="openPanel('template-info', 'info')"
                    :class="{ 'active-menu-item': activeLink === 'info' }">
                    <span x-show="currentLang === 'es'">Info</span>
                    <span x-show="currentLang === 'en'">Info</span>
                </a>
                <a href="#projects"
                    @click.prevent="openPanel('template-projects', 'projects')"
                    :class="{ 'active-menu-item': activeLink === 'projects' }">
                    <span x-show="currentLang === 'es'">Proyectos</span>
                    <span x-show="currentLang === 'en'">Projects</span>
                </a>
                <a href="#faq"
                    @click.prevent="openPanel('template-faq', 'faq')"
                    :class="{ 'active-menu-item': activeLink === 'faq' }">
                    <span x-show="currentLang === 'es'">FAQ</span>
                    <span x-show="currentLang === 'en'">FAQ</span>
                </a>
            </nav>

<div class="loader-container"
    x-show="isLoading"
    x-transition:leave="transition ease-out duration-1000"
    x-cloak>

    <div class="modern-loader">
        <!-- Partículas de fondo -->
        <div class="particles">
            <div class="particle particle--large"></div>
            <div class="particle particle--medium"></div>
            <div class="particle particle--small"></div>
        </div>
        
        <!-- Contador -->
        <div class="countdown-display" 
            x-text="countdown"
            x-transition:enter="transition ease-out duration-300"
            x-transition:leave="transition ease-in duration-200 opacity-0 scale-90">
        </div>
        
        <!-- Texto centrado y simétrico -->
        <div class="text-reveal"
            x-show="countdown === 0"
            x-transition:enter="transition ease-out duration-1000 delay-300"
            x-transition:enter-start="opacity-0 translate-y-5"
            x-transition:enter-end="opacity-100 translate-y-0">
            <div class="text-line text-line--primary">
                <span class="text-char" x-text="'Creativity'.split('').map((c) => c === ' ' ? '&nbsp;' : c).join('')"></span>
            </div>
            <div class="text-line text-line--secondary">
                <span class="text-char" x-text="'Javier Garin'.split('').map((c) => c === ' ' ? '&nbsp;' : c).join('')"></span>
            </div>
        </div>
    </div>
