<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio web de Javier Garín: Developer Full Stack y Diseñador UI/UX. Explora mis proyectos de desarrollo y diseño web." />
    <meta name="robots" content="index, follow">
    <meta name="author" content="Javier Garín">
    <meta name="theme-color" content="#000000"> 

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://javier-garin-dev.vercel.app/">
    <meta property="og:title" content="Javier Garín - Developer Full Stack & Designer UI/UX">
    <meta property="og:description" content="Explora el portafolio de Javier Garín: proyectos de desarrollo web, diseño UX/UI y soluciones digitales.">
    <meta property="og:image" content="https://javier-garin-dev.vercel.app/image/og-review.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Javier Garín Portfolio">
    <meta property="og:locale" content="es_ES">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://javier-garin-dev.vercel.app/">
    <meta name="twitter:title" content="Javier Garín - Developer Full Stack & Designer UI/UX">
    <meta name="twitter:description" content="Explora el portafolio de Javier Garín: proyectos de desarrollo web, diseño UX/UI y soluciones digitales.">
    <meta name="twitter:image" content="https://javier-garin-dev.vercel.app/image/og-review.png">

    <title>Javier Garín - Developer & Designer | UI/UX Portafolio Web</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/image/logojavier_16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/image/logojavier_32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/image/logojavier_48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/image/logojavier_64x64.png">
    <link rel="apple-touch-icon" href="/image/logojavierapple_180x180.png">
    <link rel="preload" href="/fonts/VCR_OSD_MONO.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        [x-cloak] { display: none !important; }
        html, body {
            background-color: #000000;
            color: #f8f8f8;
        }
    </style>
</head>
<body
    x-data="{
        activeLink: null,
        showPanel: false,
        panelContent: '',
        currentLang: 'es',

        openPanel(templateId, linkName) {
            if (this.showPanel && this.activeLink === linkName) {
                this.closePanel();
                return;
            }
            const template = document.getElementById(templateId);
            if (template) {
                const contentClone = template.content.cloneNode(true);
                this.panelContent = '';
                const tempDiv = document.createElement('div');
                tempDiv.appendChild(contentClone);
                this.panelContent = tempDiv.innerHTML;
                this.activeLink = linkName;
                this.showPanel = true;
            } else {
                console.error('Template no encontrado:', templateId);
                this.panelContent = '<p>Error: Contenido no encontrado.</p>';
                this.activeLink = linkName;
                this.showPanel = true;
            }
        },

        closePanel() {
            this.showPanel = false;
            this.activeLink = null;
        },

        setLang(lang) {
            this.currentLang = lang;
            if (this.showPanel && this.activeLink) {
                const activeTemplateId = `template-${this.activeLink}`;
                this.openPanel(activeTemplateId, this.activeLink);
            }
        }
    }">

    <!-- Fondo estático -->
    <div class="background"></div>

    <!-- Contenedor principal con margen -->
    <div class="main-container">
        <!-- Contenedor para la escena Three.js -->
        <div class="dynamic-background" id="threejs-container"></div>

        <!-- Contenido principal -->
        <div class="content">
            <header class="header">
                <div class="nombre-container">
                    <h1>Javier Garín</h1>
                    <h2>Developer & Designer</h2>
                </div>

                <div class="lang-switcher">
                    <button @click="setLang('es')" class="active-lang" :class="{ 'active-lang': currentLang === 'es' }">es</button>
                    <span>|</span>
                    <button @click="setLang('en')" :class="{ 'active-lang': currentLang === 'en' }">en</button>
                </div>
            </header>

            <aside class="info-panel"
                x-ref="infoPanel"
                x-show="showPanel"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="translate-x-full opacity-0"
                x-transition:enter-end="translate-x-0 opacity-100"
                @click.outside="closePanel()"
                x-cloak
                role="dialog"
                aria-modal="true">
                <button @click="closePanel()" class="close-button" aria-label="Cerrar panel">&times;</button>
                <div class="info-content" x-html="panelContent"></div>
            </aside>

            <div class="watermark">Javier Garín®</div>

            <nav class="menu-container">
                <a href="#contact"
                    @click.prevent="openPanel('template-contact', 'contact')"
                    :class="{ 'active-menu-item': activeLink === 'contact' }">
                    <span x-show="currentLang === 'es'">Contacto</span>
                    <span x-show="currentLang === 'en'" x-cloak>Contact</span>
                </a>
                <a href="#info"
                    @click.prevent="openPanel('template-info', 'info')"
                    :class="{ 'active-menu-item': activeLink === 'info' }">
                    <span x-show="currentLang === 'es'">Info</span>
                    <span x-show="currentLang === 'en'" x-cloak>Info</span>
                </a>
                <a href="#projects"
                    @click.prevent="openPanel('template-projects', 'projects')"
                    :class="{ 'active-menu-item': activeLink === 'projects' }">
                    <span x-show="currentLang === 'es'">Proyectos</span>
                    <span x-show="currentLang === 'en'" x-cloak>Projects</span>
                </a>
                <a href="#faq"
                    @click.prevent="openPanel('template-faq', 'faq')"
                    :class="{ 'active-menu-item': activeLink === 'faq' }">
                    <span x-show="currentLang === 'es'">FAQ</span>
                    <span x-show="currentLang === 'en'" x-cloak>FAQ</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Templates -->
    <template id="template-contact">
        <div x-data="{ emailCopied: false }">
            <h3 x-show="currentLang === 'es'">Contáctame</h3>
            <h3 x-show="currentLang === 'en'">Contact Me</h3>
            <p x-show="currentLang === 'es'">Aquí puedes contactarme!</p>
            <p x-show="currentLang === 'en'">You can reach me here!</p>
            
            <p class="email-container">
                <span x-show="currentLang === 'es'">Email: </span>
                <span x-show="currentLang === 'en'">Email: </span>
                <a href="#" 
                    @click.prevent="
                        if (navigator.clipboard?.writeText) {
                            navigator.clipboard.writeText('dev.javiergarin@gmail.com').then(() => {
                                emailCopied = true;
                                setTimeout(() => emailCopied = false, 2000);
                            }).catch(() => {});
                        }
                    "
                    class="copy-email"
                    :class="{ 'copied': emailCopied }">
                    dev.javiergarin@gmail.com
                </a>
                <span x-show="emailCopied" class="copied-message">
                    <span x-show="currentLang === 'es'">✓ Copiado!</span>
                    <span x-show="currentLang === 'en'">✓ Copied!</span>
                </span>
            </p>

            <p x-show="currentLang === 'es'">LinkedIn: <a href="https://www.linkedin.com/in/javgarin/" target="_blank" rel="noopener noreferrer">Perfil</a></p>
            <p x-show="currentLang === 'en'">LinkedIn: <a href="https://www.linkedin.com/in/javgarin/" target="_blank" rel="noopener noreferrer">Profile</a></p>
            <p x-show="currentLang === 'es'">Empresa: <a href="https://atacama-dev.app/" target="_blank" rel="noopener noreferrer">Atacama Dev SpA</a></p>
            <p x-show="currentLang === 'en'">Company: <a href="https://atacama-dev.app/" target="_blank" rel="noopener noreferrer">Atacama Dev SpA</a></p>
        </div>
    </template>

    <template id="template-info">
        <div>
            <h3 x-show="currentLang === 'es'">Sobre Mí</h3>
            <h3 x-show="currentLang === 'en'">About Me</h3>
            <p x-show="currentLang === 'es'">Soy Javier, un desarrollador y diseñador apasionado por crear experiencias web interactivas y visualmente atractivas.</p>
            <p><a href="https://buymeacoffee.com/gigidev" target="_blank" rel="noopener noreferrer">Buy Me a Coffee ☕💕</a></p>
            <p x-show="currentLang === 'en'">I'm Javier, a developer and designer passionate about creating interactive and visually engaging web experiences.</p>

            <h4><a href="https://github.com/JavGarin" target="_blank" rel="noopener noreferrer">
                <span x-show="currentLang === 'es'">Github aquí!</span>
                <span x-show="currentLang === 'en'">Github here!</span>
            </a></h4>

            <h4 x-show="currentLang === 'es'">Habilidades</h4>
            <h4 x-show="currentLang === 'en'">Skills</h4>
            <ul>
                <li><span x-show="currentLang === 'es'">Desarrollo Web (HTML, CSS, JavaScript)</span><span x-show="currentLang === 'en'">Web Development (HTML, CSS, JavaScript)</span></li>
                <li><span x-show="currentLang === 'es'">Librerías (Three.js, Alpine.js)</span><span x-show="currentLang === 'en'">Libraries (Three.js, Alpine.js)</span></li>
                <li>Three.js & WebGL</li>
                <li><span x-show="currentLang === 'es'">Diseño UI/UX</span><span x-show="currentLang === 'en'">UI/UX Design</span></li>
                <li>Node.js + express</li>
                <li>SQL</li>
                <li>MCP</li>
            </ul>


        </div>
    </template>

    <template id="template-projects">
        <div>
            <h3 x-show="currentLang === 'es'">Mis Proyectos</h3>
            <h3 x-show="currentLang === 'en'">My Projects</h3>
            <p x-show="currentLang === 'es'">Estos son algunos de los proyectos en los que he trabajado:</p>
            <p x-show="currentLang === 'es'">Para ver más, visita mi <a target="_blank" href="https://github.com/JavGarin">GitHub</a></p>
            <p x-show="currentLang === 'en'">Here are some of the projects I've worked on:</p>
            <p x-show="currentLang === 'en'">To see more, visit my <a target="_blank" href="https://github.com/JavGarin">GitHub</a></p>
            <ul class="projects-list">
                <li class="project-item"><a target="_blank" rel="noopener noreferrer" href="https://cupcakestore.netlify.app/">Cupcake Store App</a></li>
                <li class="project-item"><a target="_blank" rel="noopener noreferrer" href="https://gigi-landing-page-gsap.vercel.app/">gigi landing gsap</a></li>
                <li class="project-item"><a target="_blank" rel="noopener noreferrer" href="https://curve-slider-web.vercel.app/">Curve Slider Web</a></li>
                <li class="project-item"><a target="_blank" rel="noopener noreferrer" href="https://ecommerce-3ds.vercel.app/">Design ecommerce-3ds</a></li>
                <li class="project-item"><a target="_blank" rel="noopener noreferrer" href="https://javier-garin.vercel.app//">Javier Garin web</a></li>
            </ul>
        </div>
    </template>

    <template id="template-faq">
        <div>
            <h3 x-show="currentLang === 'es'">Preguntas Frecuentes</h3>
            <h3 x-show="currentLang === 'en'">Frequently Asked Questions</h3>

            <h4 x-show="currentLang === 'es'">¿Qué tipo de servicios ofreces?</h4>
            <h4 x-show="currentLang === 'en'">What kind of services do you offer?</h4>
            <p x-show="currentLang === 'es'">Ofrezco servicios de desarrollo web front-end y back-end, diseño de interfaces, creación de experiencias interactivas con Three.js, y consultoría.</p>
            <p x-show="currentLang === 'en'">I offer front-end and back-end web development services, interface design, creation of interactive experiences with Three.js, and consulting.</p>

            <h4 x-show="currentLang === 'es'">¿Cuál es tu disponibilidad?</h4>
            <h4 x-show="currentLang === 'en'">What is your availability?</h4>
            <p x-show="currentLang === 'es'">Actualmente estoy disponible para nuevos proyectos / colaboraciones. <a href="mailto:dev.javiergarin@gmail.com" target="_blank" rel="noopener noreferrer">¡Contáctame!</a></p>
            <p x-show="currentLang === 'en'">I am currently available for new projects / collaborations. <a href="mailto:dev.javiergarin@gmail.com" target="_blank" rel="noopener noreferrer">Contact me!</a></p>

            <h4 x-show="currentLang === 'es'">¿Qué tecnologías se usan aquí?</h4>
            <h4 x-show="currentLang === 'en'">What technologies are used here?</h4>
            <p x-show="currentLang === 'es'">Three.js para renderizado WebGL procedural.</p>
            <p x-show="currentLang === 'en'">Three.js for procedural WebGL rendering.</p>
            <p x-show="currentLang === 'es'">Alpine.js para reactividad de interfaz.</p>
            <p x-show="currentLang === 'en'">Alpine.js for UI reactivity.</p>
            <p x-show="currentLang === 'es'">Vite + Vanilla CSS para empaquetado y rendimiento óptimo.</p>
            <p x-show="currentLang === 'en'">Vite + Vanilla CSS for bundling and optimal performance.</p>
        </div>
    </template>

    <!-- Script principal empaquetado por Vite -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
